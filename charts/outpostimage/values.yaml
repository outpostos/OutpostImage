image:
  # This package is currently private; anonymous clusters cannot pull it. Build
  # locally (docker build -t outpostimage:latest .), make the image available on
  # every node, and override: --set image.repository=outpostimage --set image.pullPolicy=Never
  repository: ghcr.io/outpostos/outpostimage
  tag: latest
  pullPolicy: IfNotPresent

config:
  logLevel: INFO
  dockerRoot: /var/lib/docker
  registryAddr: ":5000"
  proxyAddr: ":3128"
  metricsAddr: ":9090"
  caDir: /etc/outpostimage
  peersFile: /etc/outpostimage/peers.txt

# Peer discovery configuration
discovery:
  # Kubernetes Endpoints-based peer discovery (recommended for k8s)
  kubernetes:
    enabled: true
    # Service name to watch for Endpoints — matches the headless Service created by this chart
    serviceName: ""  # defaults to release name + "-peers"
  # mDNS peer discovery (useful for bare-metal / LAN, not reliable in k8s)
  mdns:
    enabled: false
    interface: ""
    domain: "local"

# Static peers list (content for peers.txt)
# Each line is a peer address in host:port format
peers: ""

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

serviceAccount:
  create: true
  name: ""

serviceMonitor:
  enabled: false
  interval: 30s
  namespace: ""

tolerations:
  - operator: Exists

nodeSelector: {}
