apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-config
  labels:
    app.kubernetes.io/name: outpostimage
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  DOCKER_ROOT: {{ .Values.config.dockerRoot | quote }}
  REGISTRY_ADDR: {{ .Values.config.registryAddr | quote }}
  PROXY_ADDR: {{ .Values.config.proxyAddr | quote }}
  METRICS_ADDR: {{ .Values.config.metricsAddr | quote }}
  CA_DIR: {{ .Values.config.caDir | quote }}
  PEERS_FILE: {{ .Values.config.peersFile | quote }}
  {{- if .Values.discovery.kubernetes.enabled }}
  K8S_DISCOVERY: "true"
  K8S_SERVICE_NAME: {{ include "outpostimage.peersServiceName" . | quote }}
  {{- end }}
  {{- if .Values.discovery.mdns.enabled }}
  MDNS_ENABLED: "true"
  {{- if .Values.discovery.mdns.interface }}
  MDNS_INTERFACE: {{ .Values.discovery.mdns.interface | quote }}
  {{- end }}
  MDNS_DOMAIN: {{ .Values.discovery.mdns.domain | quote }}
  {{- else }}
  MDNS_ENABLED: "false"
  {{- end }}
  peers.txt: |
    {{- if .Values.peers }}
    {{ .Values.peers | nindent 4 }}
    {{- end }}
