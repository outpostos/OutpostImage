apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: outpostimage
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: outpostimage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
    - name: proxy
      port: 3128
      targetPort: proxy
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: metrics
      protocol: TCP
