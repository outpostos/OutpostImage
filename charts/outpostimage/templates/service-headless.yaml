{{- if .Values.discovery.kubernetes.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "outpostimage.peersServiceName" . }}
  labels:
    app.kubernetes.io/name: outpostimage
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: outpostimage
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: registry
      port: 5000
      targetPort: registry
      protocol: TCP
{{- end }}
